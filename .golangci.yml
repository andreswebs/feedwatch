version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - revive
    - sqlclosecheck
    - staticcheck
    - unused

  exclusions:
    rules:
      - path: (^|/)cmd/qafixtures/
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
